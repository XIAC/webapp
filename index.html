<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Empresa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="header">
    <div class="container">
      <h1 class="logo">Mi Web</h1>
      <nav>
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Servicios</a></li>
          <li><a href="#">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h2>Bienvenido</h2>
    <button onclick="mostrarMensaje()">
        Haz clic
    </button>
    <p id="mensaje"></p>
  </main>

  <footer id="footer" style="background-color:#333; color:#fff; padding:20px 0; text-align:center;">
    <div class="footer-content" style="max-width:1000px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;">
      
      <!-- Información de contacto -->
      <div class="footer-contact" style="flex:1; min-width:200px; margin:10px;">
        <h3>Contacto</h3>
        <p>Email: contacto@tusitio.com</p>
        <p>Teléfono: +34 123 456 789</p>
      </div>
      
      <!-- Enlaces útiles -->
      <div class="footer-links" style="flex:1; min-width:200px; margin:10px;">
        <h3>Enlaces</h3>
        <ul style="list-style:none; padding:0;">
          <li><a href="/sobre-nosotros" style="color:#fff; text-decoration:none;">Sobre Nosotros</a></li>
          <li><a href="/servicios" style="color:#fff; text-decoration:none;">Servicios</a></li>
          <li><a href="/contacto" style="color:#fff; text-decoration:none;">Contacto</a></li>
        </ul>
      </div>

      <!-- Redes sociales -->
      <div class="footer-social" style="flex:1; min-width:200px; margin:10px;">
        <h3>Síguenos</h3>
        <a href="#" style="margin-right:10px; color:#fff;">Facebook</a>
        <a href="#" style="margin-right:10px; color:#fff;">Twitter</a>
        <a href="#" style="color:#fff;">Instagram</a>
      </div>

    </div>

    <div class="footer-bottom" style="margin-top:20px; font-size:0.9em;">
      &copy; 2026 TuSitio.com. Todos los derechos reservados.
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
